spring.application.name=pick-a-bite

# ============================================================
# DATABASE — H2 (PostgreSQL uyumlu mod, dosyaya kaydeder)
# ============================================================
# Demo için PostgreSQL kurulumu yerine H2 kullaniyoruz.
# MODE=PostgreSQL ile aynı SQL dilini konuşur, code değişmiyor.
# Veriler ./data/pickabite-h2.mv.db içinde kalıcı.
spring.datasource.url=jdbc:h2:file:./data/pickabite-h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console (browser'da DB içeriği — opsiyonel)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================================
# Sunucu
# ============================================================
server.port=8080
# Tüm network interface'lerinden dinle — telefon LAN'dan ulaşabilsin
server.address=0.0.0.0

# ============================================================
# JWT ayarlari
# ============================================================
jwt.secret=lutfen-bu-anahtari-uretimde-degistirin-en-az-32-bayt-olmali!!
jwt.expirationMs=86400000

# ============================================================
# Jackson
# ============================================================
spring.jackson.default-property-inclusion=non_null

# ============================================================
# UTF-8 zorla (Türkçe karakterler için kritik)
# ============================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
